<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #14161a; color: #e7e9ee; padding: 24px; text-align: center;
  }
  h1 { font-size: 16px; font-weight: 600; color: #9aa2b1; margin: 0 0 20px; }
  #pinBox {
    background: #0f1114; border: 1px solid #2a2e37; border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  #pin { font-size: 40px; letter-spacing: 8px; font-weight: 700; }
  #pinLabel { font-size: 12px; color: #6b7280; margin-top: 6px; }
  #statusLine { font-size: 13px; color: #9aa2b1; margin-bottom: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; margin-right: 6px; }
  .dot.live { background: #3ecf6e; }
  #request {
    display: none; background: #1c1f26; border: 1px solid #3b6ef6;
    border-radius: 10px; padding: 16px; margin-top: 12px;
  }
  #request button { padding: 8px 16px; border-radius: 6px; border: none; margin: 0 6px; cursor: pointer; }
  #accept { background: #2fbf6e; color: white; }
  #deny { background: #e5484d; color: white; }
  #note { font-size: 12px; color: #6b7280; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>REMOTE ACCESS — HOST</h1>
  <div id="pinBox">
    <div id="pin">------</div>
    <div id="pinLabel">Share this code with the person connecting</div>
  </div>
  <div id="statusLine"><span class="dot" id="statusDot"></span><span id="statusText">Connecting to server…</span></div>

  <div id="request">
    <div id="requestText">Someone wants to connect.</div>
    <div style="margin-top:10px;">
      <button id="accept">Accept</button>
      <button id="deny">Deny</button>
    </div>
  </div>

  <div id="note">
    Screen sharing and control are only active while this window shows "Live",
    and only for the session you accepted above. Close this app to stop sharing.
  </div>

  <script src="renderer.js"></script>
</body>
</html>
